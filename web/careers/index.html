<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12324A; --teal:#0E7C7B; --teal-dark:#0A5F5E; --mist:#F4F7F6; --paper:#FFFFFF;
  --line:#D8E2E1; --muted:#4A5E66; --soft:#6B7C82; --lotus:#C2416B; --ok:#1F7A4D; --err:#B42318;
  --font:"Kantumruy Pro","Khmer UI","Leelawadee UI",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:var(--teal)}
:focus-visible{outline:3px solid #7FD1C7;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* header */
header.top{background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:18px}
.brand img{width:36px;height:36px}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--soft);line-height:1}
header.top nav a{color:var(--ink);text-decoration:none;font-weight:500}

/* hero: the river line is the one memorable element */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero .wrap{padding-top:64px;padding-bottom:88px;position:relative;z-index:1}
.hero .km{font-size:20px;color:#7FD1C7;margin:0 0 10px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 16px;max-width:15ch;font-weight:700}
.hero p{max-width:52ch;color:#C9D8DD;margin:0}
.hero svg{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:120px}
.river path{stroke-dasharray:1600;stroke-dashoffset:1600;animation:flow 2.4s ease-out .2s forwards}
@keyframes flow{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.river path{animation:none;stroke-dashoffset:0}}

/* job list */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:-28px 0 24px;position:relative;z-index:2}
.tools input,.tools select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.tools input{flex:1;min-width:220px}
.count{color:var(--muted);margin:0 0 12px;font-size:15px}
.jobs{list-style:none;margin:0 0 64px;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.jobs li+li{border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:22px 24px;text-decoration:none;color:inherit}
.job:hover h3{color:var(--teal)}
.job h3{margin:0;font-size:20px;font-weight:600}
.job .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.job .go{grid-row:span 2;font-weight:600;color:var(--teal);white-space:nowrap}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* job detail */
.back{display:inline-block;margin:28px 0 16px;text-decoration:none;font-weight:500}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start;margin-bottom:64px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px}
.detail h1{font-size:34px;line-height:1.15;margin:0 0 8px}
.detail .meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);margin-bottom:24px}
.detail h2{font-size:18px;margin:28px 0 10px}
.detail p.desc{white-space:pre-line;margin:0}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.skills li{padding:4px 12px;border-radius:999px;background:#E3F1EF;color:var(--teal-dark);font-size:14px;font-weight:500}
.skills.nice li{background:#F1F3F4;color:var(--muted)}
dl.req{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0}
dl.req dt{color:var(--soft)} dl.req dd{margin:0}

/* form */
form.apply{position:sticky;top:20px}
form.apply h2{margin:0 0 4px;font-size:22px}
form.apply .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px}
.drop.over,.drop:hover{border-color:var(--teal);background:#F0F8F7}
.drop b{color:var(--ink);display:block;font-size:15px;word-break:break-all}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted);font-size:13px;margin-top:16px}
.consent input{margin-top:3px}
button.primary{width:100%;margin-top:18px;font:inherit;font-weight:600;padding:13px;border:0;border-radius:8px;background:var(--teal);color:#fff;cursor:pointer}
button.primary:hover{background:var(--teal-dark)}
button.primary:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px}
.msg.err{background:#FDECEA;color:var(--err)}
.done{text-align:center}
.done .tick{width:56px;height:56px;border-radius:50%;background:#E3F1EF;display:grid;place-items:center;margin:4px auto 16px}
.done h2{margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 8px}
.ref{font-weight:700;color:var(--ink)}

footer{border-top:1px solid var(--line);background:var(--paper);color:var(--soft);font-size:13px}
footer .wrap{padding:20px 24px}

@media (max-width:860px){
  .detail{grid-template-columns:1fr} form.apply{position:static}
  .job{grid-template-columns:1fr} .job .go{grid-row:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><img src="/assets/logo.svg" alt=""><span><span class="company">Tonle Bank</span><small>Careers</small></span></a>
    <nav><a href="#/">Open positions</a></nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer><div class="wrap"><span class="company">Tonle Bank</span> is an equal-opportunity employer. We never ask for your age, religion, marital status or a photo.</div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_MB = 10, ACCEPT = [".pdf", ".docx", ".png", ".jpg", ".jpeg"];
let JOBS = [], COMPANY = "Tonle Bank", filters = {q: "", dept: ""};

async function api(path, opts) {
  let r;
  try { r = await fetch(path, opts); } catch { throw new Error("Can't reach the server. Check your connection and try again."); }
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.detail) || `Request failed (${r.status}).`);
  return data;
}
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}) : "";
const years = y => y > 0 ? `${y} year${y === 1 ? "" : "s"}+ experience` : "No experience required";

function hero() {
  return `<section class="hero">
    <div class="wrap">
      <p class="km" lang="km">ធ្វើការជាមួយ${esc(COMPANY.includes("Tonle") ? "ធនាគារទន្លេ" : " " + COMPANY)}</p>
      <h1>Build the bank Cambodia uses every day.</h1>
      <p>We're hiring across technology, data, credit and branch operations in Phnom Penh and the provinces. Apply in a few minutes with your CV.</p>
    </div>
    <svg class="river" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 C150 20 300 110 450 70 S750 20 900 70 1100 100 1200 60" fill="none" stroke="#7FD1C7" stroke-width="3"/>
      <path d="M0 95 C200 55 350 125 550 90 S850 50 1000 92 1150 110 1200 88" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    </svg>
  </section>`;
}

function renderList() {
  const depts = [...new Set(JOBS.map(j => j.department).filter(Boolean))].sort();
  const q = filters.q.trim().toLowerCase();
  const list = JOBS.filter(j => (!filters.dept || j.department === filters.dept) &&
    (!q || [j.title, j.department, j.location, ...j.required_skills].join(" ").toLowerCase().includes(q)));
  $("#app").innerHTML = hero() + `<div class="wrap">
    <div class="tools">
      <input id="q" type="search" placeholder="Search by job title, skill or location" value="${esc(filters.q)}" aria-label="Search jobs">
      <select id="dept" aria-label="Department"><option value="">All departments</option>
        ${depts.map(d => `<option ${d === filters.dept ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
    </div>
    <p class="count">${list.length} open position${list.length === 1 ? "" : "s"}</p>
    <ul class="jobs">${list.length ? list.map(j => `<li><a class="job" href="#/job/${j.id}">
        <h3>${esc(j.title)}</h3><span class="go">View and apply</span>
        <div class="meta"><span>${esc(j.department)}</span><span>${esc(j.location)}</span><span>${esc(j.employment_type)}</span>
          ${j.closing_date ? `<span>Closes ${fmtDate(j.closing_date)}</span>` : ""}</div></a></li>`).join("")
      : `<li class="empty">${JOBS.length ? "No positions match your search. Clear the filters to see all jobs." : "There are no open positions right now. Please check back soon."}</li>`}</ul>
  </div>`;
  $("#q").oninput = e => { filters.q = e.target.value; const pos = e.target.selectionStart; renderList(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); };
  $("#dept").onchange = e => { filters.dept = e.target.value; renderList(); };
}

function renderJob(id) {
  const j = JOBS.find(x => x.id === id);
  if (!j) { $("#app").innerHTML = `<div class="wrap"><a class="back" href="#/">‹ All positions</a><div class="panel">This position is closed or no longer exists.</div></div>`; return; }
  document.title = `${j.title} | ${COMPANY} Careers`;
  $("#app").innerHTML = `<div class="wrap">
    <a class="back" href="#/">‹ All positions</a>
    <div class="detail">
      <article class="panel">
        <h1>${esc(j.title)}</h1>
        <div class="meta"><span>${esc(j.department)}</span><span>${esc(j.location)}</span><span>${esc(j.employment_type)}</span>
          ${j.closing_date ? `<span>Apply by ${fmtDate(j.closing_date)}</span>` : ""}</div>
        <h2>About the role</h2><p class="desc">${esc(j.description) || "Details will be shared at interview."}</p>
        ${j.required_skills.length ? `<h2>What you need</h2><ul class="skills">${j.required_skills.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
        ${j.preferred_skills.length ? `<h2>Nice to have</h2><ul class="skills nice">${j.preferred_skills.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
        <h2>Requirements</h2>
        <dl class="req"><dt>Experience</dt><dd>${years(j.minimum_experience)}</dd>
          <dt>Education</dt><dd>${esc(j.education_requirement) || "No formal requirement"}</dd></dl>
      </article>
      <form class="apply panel" id="apply" novalidate>
        <h2>Apply for this job</h2>
        <p class="sub">Takes about 2 minutes. Upload your CV in English.</p>
        <label for="name">Full name</label><input id="name" type="text" autocomplete="name" required>
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
        <label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel" placeholder="+855 ...">
        <label for="cv">CV</label>
        <div class="drop" id="drop" tabindex="0" role="button" aria-describedby="cvhelp">
          <b id="fname">Choose a file or drop it here</b><span id="cvhelp">PDF, Word (.docx), JPG or PNG, up to ${MAX_MB} MB</span>
        </div>
        <input id="cv" type="file" accept="${ACCEPT.join(",")}" hidden>
        <label class="consent"><input id="consent" type="checkbox"> I agree that ${esc(COMPANY)} may process my CV to review this application. An AI tool helps sort applications; a person in HR reviews every one.</label>
        <button class="primary" id="send" type="submit">Submit application</button>
        <div id="msg"></div>
      </form>
    </div></div>`;
  wireForm(j);
}

function wireForm(job) {
  const drop = $("#drop"), input = $("#cv");
  let file = null;
  const setFile = f => {
    if (!f) return;
    const ext = "." + f.name.split(".").pop().toLowerCase();
    if (!ACCEPT.includes(ext)) return showErr(`"${f.name}" isn't a supported file. Upload a PDF, DOCX, JPG or PNG.`);
    if (f.size > MAX_MB * 1024 * 1024) return showErr(`"${f.name}" is larger than ${MAX_MB} MB. Upload a smaller file.`);
    file = f; $("#fname").textContent = f.name; $("#msg").innerHTML = "";
  };
  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  input.onchange = () => setFile(input.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); };

  $("#apply").onsubmit = async e => {
    e.preventDefault();
    const name = $("#name").value.trim(), email = $("#email").value.trim(), phone = $("#phone").value.trim();
    if (name.length < 2) return showErr("Enter your full name.", "#name");
    if (!/^\S+@\S+\.\S+$/.test(email)) return showErr("Enter a valid email address, for example dara@gmail.com.", "#email");
    if (!file) return showErr("Attach your CV.", "#drop");
    if (!$("#consent").checked) return showErr("Tick the consent box to continue.", "#consent");
    const fd = new FormData();
    fd.append("job_id", job.id); fd.append("full_name", name); fd.append("email", email);
    fd.append("phone", phone); fd.append("auto_analyze", "true"); fd.append("file", file);
    const btn = $("#send"); btn.disabled = true; btn.textContent = "Submitting...";
    try {
      const res = await api("/applications", {method: "POST", body: fd});
      $("#apply").innerHTML = `<div class="done">
        <div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
        <h2>Application received</h2>
        <p>Thank you, ${esc(name)}. We've received your application for <b>${esc(res.job_title)}</b>.</p>
        <p>Your reference number is <span class="ref">#${res.application_id}</span>. Our HR team will contact you at ${esc(email)} if you're shortlisted.</p>
        <p><a href="#/">See other open positions</a></p></div>`;
    } catch (err) {
      showErr(err.message); btn.disabled = false; btn.textContent = "Submit application";
    }
  };
}

function showErr(text, focusSel) {
  $("#msg").innerHTML = `<div class="msg err" role="alert">${esc(text)}</div>`;
  if (focusSel) $(focusSel)?.focus();
}

async function route() {
  const m = location.hash.match(/^#\/job\/(\d+)/);
  document.title = `Careers | ${COMPANY}`;
  if (m) renderJob(Number(m[1])); else renderList();
  window.scrollTo(0, 0);
}

(async () => {
  try {
    const cfg = await api("/site-config");
    COMPANY = cfg.company_name;
    document.querySelectorAll(".company").forEach(el => el.textContent = COMPANY);
    JOBS = await api("/jobs?status=Open");
  } catch (err) {
    $("#app").innerHTML = `<div class="wrap"><div class="panel" style="margin:40px 0">${esc(err.message)}</div></div>`;
    return;
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
